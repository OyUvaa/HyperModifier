name: Build HyperModifier debug (verified)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean and assemble debug APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Verify Bilibili HomeFragment hook is present in APK
        shell: bash
        run: |
          set -euo pipefail

          apk="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$apk"

          unzip -q "$apk" -d "$RUNNER_TEMP/hm-apk"

          if ! grep -aR -q 'bilibili-home-fragment-view-created' "$RUNNER_TEMP/hm-apk"; then
            echo 'ERROR: rebuilt APK does not contain the Bilibili HomeFragment hook id.'
            exit 1
          fi

          echo 'Verified: Bilibili HomeFragment hook is present in the APK.'

      - name: Print APK SHA-256
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperModifier-debug-verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
